# =============================================================================
# Grafana — Datasource: CIB Seven PostgreSQL
# Acesso ao banco do MAEZO via rede maestro_local
# Senha injetada via env PG_PASSWORD
# =============================================================================

apiVersion: 1

datasources:
  - name: CIB Seven DB
    type: postgres
    access: proxy
    url: postgres:5432
    database: cibseven
    user: maestro
    secureJsonData:
      password: ${PG_PASSWORD}
    uid: cibseven-pg
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    editable: true
