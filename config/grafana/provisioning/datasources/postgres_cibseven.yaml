# =============================================================================
# Grafana — Datasource: CIB Seven PostgreSQL (MAEZO)
#
# DEPENDÊNCIA OPCIONAL: aponta para o postgres do MAEZO via maestro_local.
# Usado pelos dashboards maezo-instance-detail e maezo-rc-ops.
# Se o MAEZO estiver fora, este datasource falha mas o Grafana continua rodando.
# =============================================================================

apiVersion: 1

datasources:
  - name: CIB Seven DB
    type: postgres
    access: proxy
    url: postgres:5432
    database: cibseven
    user: maestro
    secureJsonData:
      password: ${MAEZO_PG_PASSWORD}
    uid: cibseven-pg
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    editable: true
