# =============================================================================
# AUSTA — Prometheus (stack independente de monitoramento)
#
# Porta externa: 9091 (MAEZO ocupa 9090)
#
# Exporters próprios (neste compose):
#   node_exporter: host.docker.internal:9100  (host mode)
#   cadvisor:      cadvisor:8080              (austa-net)
#
# Exporters do MAEZO (via maestro_local — requerem MAEZO rodando):
#   kafka_exporter:9308, postgres_exporter:9187
#   workers_rc/co/pa/ps:8000, cib7_exporter:7979
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    environment: local
    platform:    austa

alerting:
  alertmanagers: []

scrape_configs:

  # ── Prometheus self-monitoring ─────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus-austa

  # ── Workers MAEZO (CIB Seven External Task) — requer MAEZO rodando ─────────
  - job_name: maezo_workers
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - workers_rc:8000
          - workers_co:8000
          - workers_pa:8000
          - workers_ps:8000
        labels:
          component: worker
    relabel_configs:
      - source_labels: [__address__]
        regex: 'workers_(.+):.*'
        target_label: domain
        replacement: '${1}'

  # ── Contract Extraction API — requer MAEZO rodando ────────────────────────
  - job_name: maezo_ce_api
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["ce_api:8000"]
        labels:
          component: api
          service:   contract_extraction

  # ── CIB Seven BPM Engine (via json_exporter) — requer MAEZO rodando ───────
  - job_name: cib7_bpm
    scrape_interval: 15s
    metrics_path: /probe
    static_configs:
      - targets:
          - "http://cib7:8080/engine-rest/metrics/process-instances/sum|process_instances"
          - "http://cib7:8080/engine-rest/metrics/flow-node-instances/sum|flow_node_instances"
          - "http://cib7:8080/engine-rest/metrics/job-successful/sum|job_successful"
          - "http://cib7:8080/engine-rest/metrics/job-failed/sum|job_failed"
          - "http://cib7:8080/engine-rest/metrics/activity-instance-end/sum|activity_instance_end"
          - "http://cib7:8080/engine-rest/metrics/decision-instances/sum|decision_instances"
        labels:
          component: bpm_engine
          service:   cibseven
    relabel_configs:
      - source_labels: [__address__]
        regex: "(.*?)\\|(.*)"
        target_label: __param_target
        replacement: "${1}"
      - source_labels: [__address__]
        regex: "(.*?)\\|(.*)"
        target_label: __param_module
        replacement: "${2}"
      - source_labels: [__address__]
        regex: "(.*?)\\|(.*)"
        target_label: cib7_metric
        replacement: "${2}"
      - target_label: __address__
        replacement: "cib7_exporter:7979"

  # ── Node Exporter (host) ──────────────────────────────────────────────────
  - job_name: node
    scrape_interval: 15s
    static_configs:
      - targets: ["austa-host:9100"]
        labels:
          component: infrastructure
          service:   node_exporter

  # ── cAdvisor (containers) ─────────────────────────────────────────────────
  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: infrastructure
          service:   cadvisor

  # ── Kafka exporter — descomentar quando kafka_exporter estiver no compose ──
  # - job_name: kafka
  #   scrape_interval: 30s
  #   static_configs:
  #     - targets: ["kafka_exporter:9308"]
  #       labels:
